<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120b0a">
<title>Mes Cartes</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Mes Cartes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Look unique, sombre, voulu (bordeaux et marron, demande de Trésor). Mise en page : une colonne, une carte au centre, comme l'app de Malik. */
/* Design : cartes de Malik ([S029], captures APLI 1 à 6), en bordeaux et marron. Règles : Système/Prompts/App-QR-règles.md */
:root{
  --bg:#120b0a; --bg-glow:#2a1210; --card:#1b1210; --card-2:#221714; --line:#3a2721;
  --text:#f4ebe6; --muted:#9c8578; --dim:#6d5a50;
  --bordeaux:#7d1f2e; --bordeaux-hi:#a3293d; --caramel:#c58b5b; --caramel-soft:#2b1d16;
  --vert:#7fae7a; --vert-soft:#1d2a1c;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 60% at 50% -10%,var(--bg-glow) 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);font:16px/1.5 var(--sans);
  padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 36px);max-width:680px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
.kicker{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--caramel)}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:8px 0 4px}
.lead{color:var(--muted);font-size:14px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{font:11px var(--mono);color:var(--muted)}
.stat.hot b{color:var(--bordeaux-hi)} .stat.ok b{color:var(--vert)}
.levels{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.lvl{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font:500 12px var(--mono);color:var(--muted)}
.lvl.on{background:var(--bordeaux);border-color:var(--bordeaux-hi);color:#fff}
.all{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:16px;padding:16px 18px;margin-bottom:10px;
  background:linear-gradient(135deg,var(--bordeaux-hi),var(--bordeaux) 55%,#4a1219);color:#fff;font-weight:600;font-size:16px;box-shadow:0 10px 30px -12px rgba(163,41,61,.7)}
.all small{font:12px var(--mono);opacity:.85}
.ghost{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 18px;margin-bottom:18px;font-weight:600}
.ghost small{font:12px var(--mono);color:var(--caramel)}
.sec{font:500 11px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin:18px 0 10px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:8px;transition:border-color .15s,transform .15s}
.row:active{transform:scale(.99)} .row:hover{border-color:var(--bordeaux)}
.row.vide{opacity:.5}
.tag{flex:none;width:62px;font:500 10px var(--mono);letter-spacing:.06em;color:var(--caramel);background:var(--caramel-soft);border-radius:8px;padding:6px 0;text-align:center}
.tinfo{flex:1;min-width:0}
.tinfo b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tinfo small{font:11px var(--mono);color:var(--muted)}
.mini{height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--bordeaux),var(--caramel))}
.due{flex:none;font:600 12px var(--mono);color:var(--bordeaux-hi)}
/* Badge doré « Nouveau » (demande de Trésor du 07/10/2026) : sur un thème, un chapitre ou une carte ajoutés depuis sa 1re visite. Il part une fois ouvert. */
.nouv{flex:none;display:inline-flex;align-items:center;gap:4px;font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#2a1a05;background:linear-gradient(135deg,#fbe6a2,#e0b048 50%,#b07b1e);border-radius:999px;padding:5px 9px;box-shadow:0 0 14px -3px rgba(232,182,72,.75)}
.nouv i{font-style:normal;font-size:11px}
.meta .nouv{padding:3px 8px}
/* Grande bannière « Nouveau » de l'accueil (Trésor, 07/10/2026) : au clic, elle part en poussière d'or et mène au nouveau chapitre. */
.ban{position:relative;display:block;width:100%;text-align:left;border:0;border-radius:20px;padding:22px 20px 20px;margin:4px 0 22px;overflow:hidden;cursor:pointer;color:var(--text);
  background:radial-gradient(120% 140% at 0% 0%,#4a3510 0%,#22170b 55%,#170f0a 100%);
  box-shadow:0 0 0 1px rgba(232,182,72,.6) inset,0 20px 44px -18px rgba(232,182,72,.6);transition:transform .6s ease,opacity .6s ease}
.ban::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,236,170,.2) 45%,transparent 60%);transform:translateX(-100%);animation:brille 3.2s ease-in-out infinite}
@keyframes brille{to{transform:translateX(100%)}}
.ban .k{display:block;font:700 11px/1 var(--mono);letter-spacing:.34em;color:#e8c066}
.ban h2{font-size:52px;line-height:1;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin:12px 0 6px;background:linear-gradient(180deg,#fff6d2,#ecc05a 55%,#b07b1e);-webkit-background-clip:text;background-clip:text;color:transparent}
.ban .ligne{display:flex;align-items:flex-end;flex-wrap:wrap;gap:30px 16px;margin:12px 0 10px}   /* place au-dessus de « lune » pour les flèches */
.ban .ligne h2{margin:0}
.ban .cri{display:block;font-size:22px;line-height:1.2;font-weight:800;color:#fff1cc;margin:0;text-shadow:0 0 18px rgba(232,182,72,.45)}
.ban .e-lune{position:relative;display:inline-block}
.ban .fleches{position:absolute;left:78%;bottom:50%;width:34px;height:50px;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 6px rgba(255,214,120,.8))}
.ban .fleches .f{animation:vers-le-ciel 2.4s cubic-bezier(.3,.7,.4,1) infinite;opacity:0}
.ban .fleches .f2{animation-delay:.25s} .ban .fleches .f3{animation-delay:.5s}
@keyframes vers-le-ciel{0%{opacity:0;translate:-4px 8px}20%{opacity:1}70%{opacity:1}100%{opacity:0;translate:10px -14px}}
.ban p{color:#e9d3a6;font-size:14px;font-weight:600;margin:0}
.ban .go{display:inline-block;margin-top:16px;padding:10px 16px;border-radius:999px;background:linear-gradient(135deg,#fbe6a2,#e0b048 50%,#b07b1e);color:#2a1a05;font:700 12px/1 var(--mono);letter-spacing:.06em;box-shadow:0 6px 18px -6px rgba(232,182,72,.8)}
.ban.part{opacity:0;transform:scale(.94)}
.poudre{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
/* Bouton « Activer les notifications » (site public seulement, OneSignal, décision 40). */
.cloche{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1px solid #b07b1e;background:linear-gradient(135deg,rgba(224,176,72,.16),rgba(176,123,30,.08));border-radius:16px;padding:14px 18px;margin:0 0 18px;font-weight:700;color:#fff1cc}
.cloche small{font:12px var(--mono);font-weight:400;color:#d6b673}
.cloche.ok{border-color:var(--vert);background:var(--vert-soft);color:#dff0dc}
.cloche.ok small{color:var(--vert)}
.cloche.info{font-weight:600;font-size:14px;line-height:1.45}
/* Courbes d'évolution (Mes analyses). Une couleur par graphique, lignes 2 px, points de 8 px, grille discrète. */
.courbe{margin:4px 0 14px} .courbe b{display:block;font:500 12px var(--mono);color:var(--muted);margin-bottom:4px}
.courbe svg{display:block;width:100%;height:auto;overflow:visible}
.courbe .grille{stroke:var(--line);stroke-width:1}
.courbe .axe{font:10px var(--mono);fill:var(--dim)}
.courbe .val{font:600 11px var(--mono);fill:var(--text)}
.courbe .trait{fill:none;stroke:var(--caramel);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.courbe .point{fill:var(--caramel);stroke:var(--card);stroke-width:2}
.courbe .zone{fill:transparent;cursor:pointer}
.courbe .pt:hover .point{r:6}
.chiffres summary{cursor:pointer;font:12px var(--mono);color:var(--muted)}
.chiffres table{width:100%;margin-top:8px;border-collapse:collapse;font:12px var(--mono)}
.chiffres th,.chiffres td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)} .chiffres th{color:var(--muted);font-weight:500}
/* Forces et faiblesses (Mes analyses) : une jauge par ligne, vert = force, bordeaux = faiblesse, toujours avec le % écrit. */
.fb{padding:8px 0;border-bottom:1px solid var(--line)} .fb:last-child{border-bottom:0}
.fb .l{display:flex;justify-content:space-between;gap:10px;font-size:14px} .fb .l span:last-child{font:600 12px var(--mono);flex:none}
.jauge{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden} .jauge i{display:block;height:100%;border-radius:3px}
.fb.fort .jauge i{background:var(--vert)} .fb.fort .l span:last-child{color:var(--vert)}
.fb.faible .jauge i{background:var(--bordeaux-hi)} .fb.faible .l span:last-child{color:#e9a3ad}
.travail-btn{margin-top:8px;border:1px solid var(--bordeaux-hi);background:rgba(125,31,46,.18);color:#f4ebe6;border-radius:10px;padding:7px 12px;font:600 12px var(--mono)}
.row.cible{border-color:#e0b048;box-shadow:0 0 0 1px #e0b048 inset;animation:halo 1.4s ease-in-out infinite}
@keyframes halo{50%{box-shadow:0 0 0 1px #e0b048 inset,0 0 24px -2px rgba(232,182,72,.75)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.x{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font:12px var(--mono);color:var(--muted)}
.count{font:12px var(--mono);color:var(--muted)}
h2.titre{font-size:22px;font-weight:700;margin-bottom:4px}
.space{height:12vh}
.meta{font:11px var(--mono);color:var(--dim);margin:0 0 8px 4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.meta .t{color:var(--text);letter-spacing:.06em} .meta .k{color:var(--caramel)}
.dotr{width:6px;height:6px;border-radius:50%;background:var(--bordeaux-hi);display:inline-block}
.qcard{display:block;width:100%;text-align:left;background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:16px;padding:20px 18px;
  box-shadow:0 20px 50px -25px rgba(0,0,0,.8);animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qcard h3{font-size:19px;line-height:1.4;font-weight:700;letter-spacing:-.01em}
.extrait{margin-top:14px;padding:12px 14px;border-left:3px solid var(--bordeaux-hi);background:rgba(125,31,46,.12);border-radius:0 10px 10px 0;font-size:14px;font-style:italic;color:#e8d9d0;white-space:pre-wrap}
.tap{display:block;margin-top:16px;font:12px var(--mono);color:var(--caramel)}
.choix{display:grid;gap:8px;margin-top:14px}
.choix button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:15px}
.choix button.bon{border-color:var(--vert);background:var(--vert-soft)}
.choix button.faux{border-color:var(--bordeaux-hi);background:rgba(125,31,46,.25)}
.choix button:disabled{cursor:default}
.rep{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:15px;line-height:1.6}
.rep p+p{margin-top:4px} .w{color:var(--muted)}
.box{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55}
.box b{display:block;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.box.expl{background:var(--caramel-soft);border:1px solid #4a3326} .box.expl b{color:var(--caramel)}
.box.zyl{background:rgba(125,31,46,.14);border:1px solid #4d2228} .box.zyl b{color:#e07a8a}
.ref{margin-top:12px;font:11px var(--mono);color:var(--dim)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;animation:in .25s ease}
.btns.deux{grid-template-columns:repeat(2,1fr)} .btns.un{grid-template-columns:1fr}
.btns button{border-radius:12px;padding:13px 6px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card)}
.btns small{display:block;font:400 10px var(--mono);margin-top:3px;opacity:.8}
.btns .b1{border-color:#5a2a30;color:#e9a3ad}
.btns .b2{background:linear-gradient(135deg,var(--bordeaux-hi),var(--bordeaux));border-color:var(--bordeaux-hi);color:#fff}
.btns .b3{border-color:var(--caramel);color:var(--caramel)}
.signal{display:block;margin:16px auto 0;border:0;background:none;font:11px var(--mono);color:var(--dim)}
.signal.on{color:var(--bordeaux-hi)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card-2);border:1px solid var(--bordeaux);color:var(--text);font-size:13px;padding:10px 14px;border-radius:12px;max-width:90vw;animation:in .2s ease;z-index:5}
.prog{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.04)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--bordeaux),var(--bordeaux-hi) 70%,var(--caramel));transition:width .3s}
.fin{text-align:center;padding:40px 10px} .fin b{display:block;font-size:24px;margin-bottom:8px} .fin p{color:var(--muted)}
.retour{margin-top:22px;border:0;border-radius:14px;padding:14px 22px;background:var(--bordeaux);color:#fff;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 14px;background:var(--card);border:1px dashed var(--line);border-radius:16px}
.ana{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:8px}
.ana .l{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.ana .l span:last-child{font:12px var(--mono);color:var(--muted);flex:none}
.ana + .ana{margin-top:0}
.verdict{font-size:15px;margin-bottom:6px}
.verdict b{color:var(--caramel)}
.foot{display:flex;gap:8px;margin-top:26px}
.foot button,.foot label{flex:1;text-align:center;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px;font:12px var(--mono);color:var(--muted);cursor:pointer}
.foot input{display:none}
.res{cursor:pointer}
.travail{font:11px var(--mono);color:var(--caramel);margin-bottom:10px}
.extrait b{display:block;font:500 10px var(--mono);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--caramel);margin-bottom:4px}
.extrait{margin:0 0 14px}
.essai{margin-top:10px;font-size:14px;color:#e9a3ad}
.choix button{display:flex;gap:12px;align-items:flex-start}
.lettre{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:600 12px var(--mono);background:var(--caramel-soft);color:var(--caramel)}
.choix button.sel{border-color:var(--caramel);background:var(--caramel-soft)}
.choix button.sel .lettre{background:var(--caramel);color:var(--bg)}
.choix button.bon .lettre{background:var(--vert);color:var(--bg)}
.choix button.faux .lettre{background:var(--bordeaux-hi);color:#fff}
.valider{display:block;width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--bordeaux-hi),var(--bordeaux));color:#fff}
.valider:disabled{opacity:.35;cursor:default}
.verdict-ok{color:var(--vert);font-weight:700} .verdict-ko{color:#e9a3ad;font-weight:700}
.notes{margin-top:14px;font-size:13px}
.notes summary{cursor:pointer;font:12px var(--mono);color:var(--muted)}
.notes textarea{width:100%;margin-top:8px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:14px var(--sans);resize:vertical}
.logo{width:40px;height:40px;border-radius:50%;display:block;box-shadow:0 0 0 2px var(--bordeaux),0 0 0 4px var(--caramel-soft),0 8px 20px -8px rgba(197,139,91,.55)}
.logo.grand{width:72px;height:72px;margin-bottom:14px;box-shadow:0 0 0 3px var(--bordeaux),0 0 0 6px var(--caramel-soft),0 14px 34px -10px rgba(197,139,91,.6)}
.top .logo{flex:none}
.chrono{position:relative;height:26px;margin-top:14px;border-radius:8px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.chrono i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--bordeaux),var(--caramel));opacity:.35;transition:width .25s linear}
.chrono span{position:relative;display:block;text-align:center;font:600 12px/26px var(--mono);color:var(--text)}
.chrono.presse{border-color:var(--bordeaux-hi)} .chrono.presse span{color:#e9a3ad}
.jours{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.jours b{font-size:16px} .jours span{font:11px var(--mono);color:var(--muted)}
.jours.ok{border-color:var(--caramel)}
.note{font:11px var(--mono);color:var(--dim);margin-top:10px;text-align:center}
.sync{display:inline-flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--muted);margin-bottom:16px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sync.on i{background:var(--vert)}
button:focus-visible,label:focus-within{outline:2px solid var(--caramel);outline-offset:2px}
/* ---------- Le jeu (Trésor, 12/10/2026) : rangs, combo, objectif, trophées, coffre. Or, bordeaux, caramel. ---------- */
.qcard{position:relative}
.num{position:absolute;top:10px;right:12px;font:500 10px/1 var(--mono);letter-spacing:.06em;color:var(--dim);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:999px;padding:4px 8px}
.qcard .travail{padding-right:70px}
.num-l{font:500 10px var(--mono);color:var(--dim)}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:-4px 0 12px}
.fl{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font:600 12px var(--mono);color:var(--muted);justify-self:start;transition:transform .12s,border-color .15s}
.fl:active{transform:scale(.97)} .fl:disabled{opacity:.3;cursor:default}
.fl.or{justify-self:end;color:#2a1a05;border-color:#b07b1e;background:linear-gradient(135deg,#fbe6a2,#e0b048 55%,#b07b1e);box-shadow:0 6px 16px -8px rgba(232,182,72,.8)}
.revue-t{font:11px var(--mono);color:var(--caramel)}
.qcard.revue{border-color:#4a3326}
.combo{justify-self:center;font:800 13px/1 var(--mono);letter-spacing:.04em;color:#fff1cc;padding:7px 11px;border-radius:999px;background:linear-gradient(135deg,#7d1f2e,#a3293d);box-shadow:0 0 0 1px rgba(232,182,72,.5) inset;animation:pouls 1.1s ease-in-out infinite}
.combo.chaud{background:linear-gradient(135deg,#b07b1e,#e0b048);color:#2a1a05;box-shadow:0 0 18px -2px rgba(232,182,72,.8)}
.combo.feu{background:linear-gradient(135deg,#fff2c2,#e0b048 45%,#b07b1e);color:#2a1a05;box-shadow:0 0 26px 0 rgba(255,214,120,.9);animation:pouls .6s ease-in-out infinite}
@keyframes pouls{50%{transform:scale(1.08)}}
.gain{position:fixed;left:50%;top:38%;transform:translateX(-50%);font:900 30px/1 var(--sans);color:#ffe7a3;text-shadow:0 0 18px rgba(232,182,72,.9),0 2px 0 #7a4e0c;pointer-events:none;z-index:70;animation:monte 1.25s ease-out forwards}
@keyframes monte{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

<script>
(function(){
  var CFG = window.QR_CONFIG || {niveaux:{}, themes:[]};

  var MIN = 6e4, JOUR = 864e5;

  var MAITRISE = 3;                          // palier 3 = 15 jours = « je maîtrise »
  var SERIE = 40;                            // questions par série, comme l'examen du code
  var REUSSI = 35 / 40;                      // réussi à 35 sur 40, comme au code
  var K_MEM = "qr-cartes-v2", K_SIG = "qr-signal-v1";

  function lire(k){ try { return JSON.parse(localStorage.getItem(k) || "{}") || {}; } catch(e) { return {}; } }

  var hist = (function(){ try { var h = JSON.parse(localStorage.getItem("qr-historique-v1") || "[]"); return Array.isArray(h) ? h : []; } catch(e){ return []; } })();

  /* ---------- Badge « Nouveau » ----------
     Une carte est nouvelle si elle a été ajoutée (champ "ajout") après la 1re visite de cet appareil

     une carte nouvelle plus récente que la dernière fois où on l'a ouvert. */
  var K_VU = "qr-vu-v1", K_DEBUT = "qr-debut-v1", vu = lire(K_VU);
  var debut = (function(){
    try {
      var d = localStorage.getItem(K_DEBUT); if (d) return d;
      var t = Infinity; for (var k in mem) if (mem[k] && mem[k].dernier && mem[k].dernier < t) t = mem[k].dernier;
      // Appareil neuf : la dernière mise à jour compte comme « Nouveau » (pour la voir et la tester une fois).
      var der = CARTES.reduce(function(m, c){ return c.ajout && c.ajout > m ? c.ajout : m; }, "");
      var veille = der ? aujourdhui(new Date(new Date(der + "T12:00:00").getTime() - JOUR)) : aujourdhui();
      d = t < Infinity ? aujourdhui(new Date(t)) : veille;

      var kc = x.theme + "|" + x.chapitre, kt = "T|" + x.theme;
      if (!o[kc] || x.ajout > o[kc]) o[kc] = x.ajout;

  var app = document.getElementById("app"), prog = document.getElementById("prog");
  var rafraichir = null;   // l'écran à redessiner quand les progrès arrivent d'un autre appareil
  var s = { niveau: "tous", file: [], fait: 0, total: 0, vue: false, choix: null, rates: {}, titre: "", retour: null };

  function cite(x){ return /«/.test(String(x)) ? esc(x) : '« '+esc(x)+' »'; }

  function m(c){ return mem[c.id] || {p:-1, due:0, vus:0, ok:0, ko:0, oubli:0, top:-1}; }
  function okNiv(c){ return s.niveau === "tous" || String(c.niveau) === s.niveau; }

  /* ---------- Évolution semaine par semaine (Trésor, 07/10/2026) ----------
     Deux petits graphiques séparés (jamais deux échelles sur un même graphique) :
     le score du 1er coup (moyenne de la semaine) et les cartes maîtrisées (fin de semaine). */
  function cleHist(r){ return r.t ? "t" + r.t : r.d + "|" + r.s + "|" + r.n + "|" + r.m; }
  function fusionHist(a, b){
    var vu = {}, l = [];
    a.concat(b).forEach(function(r){ var k = cleHist(r); if (!vu[k]){ vu[k] = 1; l.push(r); } });
    return l.sort(function(x, y){ return (x.d < y.d ? -1 : x.d > y.d ? 1 : (x.t || 0) - (y.t || 0)); });
  }
  function lundi(d){ var x = new Date(d + "T12:00:00"); var j = (x.getDay() + 6) % 7; x.setDate(x.getDate() - j); return aujourdhui(x); }
  function semaines(){
    var g = {}, ordre = [];
    hist.forEach(function(r){ var k = lundi(r.d); if (!g[k]){ g[k] = {k: k, s: 0, c: 0, m: 0, n: 0}; ordre.push(k); } g[k].s += r.s; g[k].c++; g[k].m = r.m; g[k].n += r.n; });
    ordre.sort();
    return ordre.map(function(k){ var o = g[k]; return {k: k, s: Math.round(o.s / o.c), m: o.m, n: o.n, series: o.c}; });
  }
  function jjmm(k){ return k.slice(8, 10) + "/" + k.slice(5, 7); }
  function courbe(pts, cle, titre, unite, max){
    var W = 320, H = 130, g = 34, dr = 12, ht = 14, bas = 24, n = pts.length;
    var x = function(i){ return n === 1 ? (g + W - dr) / 2 : g + i * (W - g - dr) / (n - 1); };
    var y = function(v){ return ht + (1 - v / max) * (H - ht - bas); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(titre) + '">';
    [0, max / 2, max].forEach(function(v){
      svg += '<line x1="' + g + '" x2="' + (W - dr) + '" y1="' + y(v) + '" y2="' + y(v) + '" class="grille"/>'
           + '<text x="' + (g - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" class="axe">' + Math.round(v) + unite + '</text>';
    });
    if (n > 1) svg += '<polyline class="trait" points="' + pts.map(function(p, i){ return x(i) + "," + y(p[cle]); }).join(" ") + '"/>';
    pts.forEach(function(p, i){
      var bulle = "Semaine du " + jjmm(p.k) + " : " + p[cle] + unite + " (" + p.series + " série" + (p.series > 1 ? "s" : "") + ")";
      svg += '<g class="pt"><circle cx="' + x(i) + '" cy="' + y(p[cle]) + '" r="12" class="zone"><title>' + esc(bulle) + '</title></circle>'
           + '<circle cx="' + x(i) + '" cy="' + y(p[cle]) + '" r="4" class="point"/></g>';
      if (i === 0 || i === n - 1 || n <= 6) svg += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" class="axe">' + jjmm(p.k) + '</text>';
    });
    var der = pts[n - 1];
    svg += '<text x="' + Math.min(x(n - 1), W - dr) + '" y="' + (y(der[cle]) - 9) + '" text-anchor="end" class="val">' + der[cle] + unite + '</text>';
    return '<div class="courbe"><b>' + esc(titre) + '</b>' + svg + '</div>';
  }

  /* ---------- Notifications sur le téléphone (OneSignal, décision 40) ----------

  /* ---------- Son « Nouveau » (demande de Trésor du 07/10/2026) ----------
     Quand une mise à jour apporte des nouveautés, le son joue à l'ouverture de l'app, puis toutes les 5 minutes
     tant que l'app est ouverte, jusqu'à ce qu'on ouvre le thème marqué « Nouveau ». Ensuite il se tait jusqu'à

  var K_SON = "qr-son-v1", K_BAN = "qr-banniere-v1", SON_MS = 5 * MIN, sonMinuteur = null, son = null;

  /* Poussière d'or : des grains dorés s'envolent de l'élément puis retombent en s'éteignant (1 s environ). */
  function poudreDor(el){
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var r = el.getBoundingClientRect(), cv = document.createElement("canvas"), dpr = window.devicePixelRatio || 1;
    cv.className = "poudre"; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; document.body.appendChild(cv);
    var ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
    var ors = ["#fff6d2", "#fbe6a2", "#ecc05a", "#e0b048", "#b07b1e", "#fffbe8"], g = [];
    for (var i = 0; i < 170; i++) g.push({x: r.left + Math.random() * r.width, y: r.top + Math.random() * r.height,
      vx: (Math.random() - .5) * 4.2, vy: -Math.random() * 3.6 - .4, t: 1.2 + Math.random() * 2.6,
      c: ors[i % ors.length], v: 1, d: .010 + Math.random() * .014});
    (function anime(){
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      var vivants = 0;
      g.forEach(function(p){
        if (p.v <= 0) return; vivants++;
        p.vy += .06; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.v -= p.d;
        ctx.globalAlpha = Math.max(p.v, 0); ctx.fillStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.t, 0, 6.283); ctx.fill();
      });
      if (vivants) requestAnimationFrame(anime); else cv.remove();
    })();
  }
  var MAJ = CARTES.reduce(function(m, c){ return c.ajout && c.ajout > m ? c.ajout : m; }, "");
  function sonAttendu(){
    if ((lire(K_SON).maj || "") === MAJ) return false;
    var nv = nouveautes();
    return Object.keys(nv).some(function(k){ return k.indexOf("T|") === 0 && !!nv[k]; });
  }
  function arreterSon(){ clearInterval(sonMinuteur); sonMinuteur = null; if (son){ try { son.pause(); son.currentTime = 0; } catch(e){} } }
  // La nouveauté est ouverte : plus de rappel toutes les 5 min. Le son en cours finit ses 16 s (il accompagne la poussière d'or).
  function sonVu(){ ecrire(K_SON, {maj: MAJ, le: aujourdhui()}); clearInterval(sonMinuteur); sonMinuteur = null; }
  function sonUneFois(){ try { if (!son) son = new Audio("son/nouveau.mp3"); son.volume = 1; son.currentTime = 0; var p = son.play(); if (p && p.catch) p.catch(function(){}); } catch(e){} }
  function attendreGeste(){
    function un(){ document.removeEventListener("click", un, true); setTimeout(function(){ if (!(son && !son.paused)) jouerSon(); }, 50); }
    document.addEventListener("click", un, true);
  }
  function jouerSon(){
    if (!sonAttendu()){ arreterSon(); return; }
    try {
      if (!son) son = new Audio("son/nouveau.mp3");
      son.volume = 1;   // volume au maximum de la page (le volume du téléphone, lui, reste à la personne)
      son.currentTime = 0;
      var p = son.play();
      if (p && p.catch) p.catch(function(){ attendreGeste(); });
    } catch(e){}
  }
  function couperSon(){ if (son && !son.paused){ try { son.pause(); son.currentTime = 0; } catch(e){} } }
  document.addEventListener("pointerdown", couperSon, true);
  document.addEventListener("keydown", couperSon, true);
  function lancerSon(){ arreterSon(); if (!sonAttendu()) return; jouerSon(); sonMinuteur = setInterval(jouerSon, SON_MS); }

  accueil();
  brancher();
  lancerSon();
})();
</script>
